
name: Build NEXORA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "native/**"
      - "assets/**"
      - "nexora-android-icon.zip"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Kotlin
        run: |
          sed -i "/classpath 'com.android.tools.build:gradle:8.2.1'/a\\        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'" android/build.gradle

          sed -i "/apply plugin: 'com.android.application'/a apply plugin: 'kotlin-android'" android/app/build.gradle

      - name: Install NEXORA native files
        run: |
          JAVA_DIR="android/app/src/main/java/br/com/edrim2/nexoraai"
          KOTLIN_DIR="android/app/src/main/kotlin/br/com/edrim2/nexoraai"

          mkdir -p "$JAVA_DIR" "$KOTLIN_DIR"

          cp native/android/MainActivity.java "$JAVA_DIR/"
          cp native/android/LocalAIPlugin.kt "$KOTLIN_DIR/"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android network access
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n<application',
                  1
              )

          if "android:usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          p.write_text(s)
          PY

      - name: Apply NEXORA app icon
        run: |
          if [ -f nexora-android-icon.zip ]; then
            mkdir -p /tmp/nexora-icon
            unzip -q nexora-android-icon.zip -d /tmp/nexora-icon
            cp -R /tmp/nexora-icon/res/. android/app/src/main/res/
          else
            echo "Custom icon archive not found. Using default icon."
          fi

      - name: Verify native integration
        run: |
          echo "=== MAIN ACTIVITY ==="
          cat android/app/src/main/java/br/com/edrim2/nexoraai/MainActivity.java

          echo "=== LOCAL AI PLUGIN ==="
          cat android/app/src/main/kotlin/br/com/edrim2/nexoraai/LocalAIPlugin.kt

          echo "=== MANIFEST ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
