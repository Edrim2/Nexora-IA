name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "native/**"
      - "assets/**"
      - "nexora-android-icon.zip"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Kotlin Android
        run: |
          sed -i "/classpath 'com.android.tools.build:gradle:8.2.1'/a\\        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'" android/build.gradle

          sed -i "/apply plugin: 'com.android.application'/a apply plugin: 'kotlin-android'" android/app/build.gradle

      - name: Install NEXORA native files
        run: |
          JAVA_DIR="android/app/src/main/java/br/com/edrim2/nexoraai"
          KOTLIN_DIR="android/app/src/main/kotlin/br/com/edrim2/nexoraai"

          mkdir -p "$JAVA_DIR"
          mkdir -p "$KOTLIN_DIR"

          cp native/android/MainActivity.java "$JAVA_DIR/"
          cp native/android/LocalAIPlugin.kt "$KOTLIN_DIR/"

      - name: Inspect generated Android configuration
        run: |
          echo "=== ANDROID MANIFEST ==="
          cat android/app/src/main/AndroidManifest.xml

          echo "=== GENERATED ICON RESOURCES ==="
          find android/app/src/main/res -type f | sort | grep -E 'launcher|mipmap|ic_logo' || true

          echo "=== INSTALLED MAIN ACTIVITY ==="
          cat android/app/src/main/java/br/com/edrim2/nexoraai/MainActivity.java

          echo "=== INSTALLED LOCAL AI PLUGIN ==="
          cat android/app/src/main/kotlin/br/com/edrim2/nexoraai/LocalAIPlugin.kt

      - name: Apply NEXORA app icon
        run: |
          mkdir -p /tmp/nexora-icon
          unzip -q nexora-android-icon.zip -d /tmp/nexora-icon

          echo "=== ICON ZIP CONTENTS ==="
          find /tmp/nexora-icon/res -type f | sort

          cp -R /tmp/nexora-icon/res/. android/app/src/main/res/
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

          echo "=== FINAL ICON RESOURCES ==="
          find android/app/src/main/res -type f | sort | grep -E 'launcher|mipmap|ic_logo' || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inspect Gradle configuration
        run: |
          echo "=== ROOT BUILD GRADLE ==="
          cat android/build.gradle

          echo "=== APP BUILD GRADLE ==="
          cat android/app/build.gradle

          echo "=== SETTINGS GRADLE ==="
          cat android/settings.gradle

      - name: Verify launcher configuration
        run: |
          echo "=== FINAL MANIFEST ==="
          cat android/app/src/main/AndroidManifest.xml

          echo "=== FINAL ICON FILES ==="
          find android/app/src/main/res -type f | sort | grep -E 'launcher|mipmap|ic_logo' || true

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
