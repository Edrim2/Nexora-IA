
name: NEXORA CORE Check

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/core-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json

      - name: Install dependencies
        run: npm install

      - name: Check TypeScript
        run: npx tsc --noEmit
        
